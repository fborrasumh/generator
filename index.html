<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Temas – Cuadernos Jupyter + Mapas Conceptuales</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jsMind CSS -->
  <link rel="stylesheet" href="https://unpkg.com/jsmind@0.9.1/style/jsmind.css">
  <style>
    body { background: #f4f6f9; font-family: 'Segoe UI', system-ui, sans-serif; }
    .container { max-width: 1200px; margin-top: 20px; }
    .card { margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .notebook-cell {
      border: 1px solid #dee2e6;
      border-radius: 6px;
      margin-bottom: 10px;
      background: white;
    }
    .cell-header {
      background: #f8f9fa;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: #6c757d;
      border-bottom: 1px solid #dee2e6;
      display: flex;
      justify-content: space-between;
    }
    .cell-body {
      padding: 12px;
    }
    .markdown-body { font-size: 0.95rem; }
    .code-body {
      background: #fafafa;
      font-family: 'Fira Code', monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }
    #concept-map-container {
      width: 100%;
      height: 400px;
      border: 1px solid #ddd;
      margin-bottom: 15px;
    }
    .nav-tabs .nav-link { font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-3">📚 Generador de Cuadernos Jupyter con Mapas Conceptuales</h1>
    <p class="text-muted">Define tus temas, apartados y preguntas. Todo se procesa en tu navegador usando tu API Key de OpenAI.</p>

    <!-- Configuración -->
    <div class="card p-3">
      <div class="row g-3 align-items-end">
        <div class="col-md-2">
          <label class="form-label">🔑 OpenAI API Key</label>
          <input type="password" id="apiKey" class="form-control" placeholder="sk-...">
        </div>
        <div class="col-md-2">
          <label class="form-label">📝 Nº de temas</label>
          <input type="number" id="numTopics" class="form-control" value="2" min="1" max="10">
        </div>
        <div class="col-md-2">
          <label class="form-label">📂 Apartados por tema</label>
          <input type="number" id="numSections" class="form-control" value="3" min="1" max="8">
        </div>
        <div class="col-md-2">
          <label class="form-label">❓ Preguntas test por apartado</label>
          <input type="number" id="numQuestions" class="form-control" value="2" min="0" max="5">
        </div>
        <div class="col-md-2">
          <label class="form-label">📎 Fuentes locales (txt)</label>
          <input type="file" id="localFiles" class="form-control" multiple accept=".txt">
        </div>
        <div class="col-md-2">
          <button id="generateBtn" class="btn btn-primary w-100">⚡ Generar</button>
        </div>
      </div>
      <small class="text-muted mt-2">Las fuentes locales se adjuntarán como contexto en cada solicitud a la API.</small>
    </div>

    <!-- Progreso -->
    <div id="progressCard" class="card p-3 d-none">
      <div class="d-flex align-items-center">
        <strong id="progressText">Generando...</strong>
        <div class="spinner-border spinner-border-sm ms-2 text-primary" role="status"></div>
      </div>
      <div class="progress mt-2">
        <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width:0%"></div>
      </div>
    </div>

    <!-- Resultados -->
    <div id="resultsCard" class="card d-none">
      <div class="card-header">
        <ul class="nav nav-tabs card-header-tabs" id="topicTabs" role="tablist"></ul>
      </div>
      <div class="card-body">
        <div id="topicContent" class="tab-content"></div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- jsMind JS -->
  <script src="https://unpkg.com/jsmind@0.9.1/es6/jsmind.js"></script>
  <!-- MathJax -->
  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <script>
    (function() {
      // ------------------- Estado global -------------------
      const state = {
        apiKey: '',
        topics: [],           // cada topic: { title, sections: [{ title, content, questions: [] }], conceptMapData }
        currentTopic: 0
      };

      // ------------------- Utilidades -------------------
      function showProgress(show) {
        document.getElementById('progressCard').classList.toggle('d-none', !show);
      }

      function updateProgress(percent, text) {
        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('progressText').textContent = text;
      }

      // Leer archivos locales
      async function readLocalFiles(fileList) {
        const texts = [];
        for (const file of fileList) {
          if (file.type !== 'text/plain') continue;
          const text = await file.text();
          texts.push(text);
        }
        return texts.join('\n\n');
      }

      // Llamar a OpenAI
      async function callOpenAI(messages, model = 'gpt-3.5-turbo') {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${state.apiKey}`
          },
          body: JSON.stringify({
            model,
            messages,
            temperature: 0.7,
            max_tokens: 2000
          })
        });
        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || 'Error en la API');
        }
        const data = await response.json();
        return data.choices[0].message.content.trim();
      }

      // Generar un título de tema
      async function generateTopicTitle(index, context) {
        const messages = [
          { role: 'system', content: 'Eres un profesor que crea títulos de temas educativos.' },
          { role: 'user', content: `Propón un título atractivo para un tema de 1 hora de duración (índice ${index+1}). Contexto adicional: ${context}` }
        ];
        return await callOpenAI(messages);
      }

      // Generar apartados
      async function generateSections(topicTitle, numSections, context) {
        const messages = [
          { role: 'system', content: 'Eres un diseñador instruccional.' },
          { role: 'user', content: `Para el tema "${topicTitle}", propón exactamente ${numSections} títulos de apartados de 15-20 minutos cada uno. Devuelve una lista numerada. Contexto: ${context}` }
        ];
        const text = await callOpenAI(messages);
        const lines = text.split('\n').filter(l => /^\d+[\.\)]\s/.test(l)).map(l => l.replace(/^\d+[\.\)]\s*/, ''));
        return lines.slice(0, numSections);
      }

      // Generar contenido de un apartado
      async function generateSectionContent(topicTitle, sectionTitle, context) {
        const messages = [
          { role: 'system', content: 'Eres un experto en la materia. Escribe contenido didáctico en Markdown, usando fórmulas LaTeX encerradas entre $ o $$.' },
          { role: 'user', content: `Escribe el contenido para el apartado "${sectionTitle}" del tema "${topicTitle}". Incluye explicaciones, ejemplos y al menos 2 fórmulas LaTeX. Contexto: ${context}` }
        ];
        return await callOpenAI(messages);
      }

      // Generar preguntas test
      async function generateQuestions(sectionContent, numQuestions) {
        const messages = [
          { role: 'system', content: 'Eres un evaluador. Genera preguntas tipo test con 4 opciones (A,B,C,D) y marca la correcta.' },
          { role: 'user', content: `Basado en el siguiente contenido, genera ${numQuestions} preguntas tipo test. Formato:\n1. Pregunta\nA) ...\nB) ...\nC) ...\nD) ...\nCorrecta: letra\n\nContenido:\n${sectionContent}` }
        ];
        const text = await callOpenAI(messages);
        // Parseo simple
        const questions = [];
        const blocks = text.split(/\n(?=\d+\. )/);
        for (const block of blocks) {
          const lines = block.split('\n').filter(l => l.trim());
          if (lines.length < 6) continue;
          const question = lines[0].replace(/^\d+\.\s*/, '');
          const options = lines.slice(1, 5).map(l => l.replace(/^[A-D]\)\s*/, ''));
          const correctLine = lines.find(l => /^Correcta:/i.test(l)) || '';
          const correct = correctLine.replace(/^Correcta:\s*/i, '').trim();
          questions.push({ question, options, correct });
        }
        return questions;
      }

      // Generar datos del mapa conceptual
      async function generateConceptMap(topicTitle, sections) {
        const messages = [
          { role: 'system', content: 'Eres un experto en mapas conceptuales. Devuelve un JSON con formato node_tree para jsMind.' },
          { role: 'user', content: `Crea un mapa conceptual para el tema "${topicTitle}" con los apartados: ${sections.join(', ')}. Formato JSON: { "meta": { "name": "Tema" }, "format": "node_tree", "data": { "id": "root", "topic": "Título", "children": [ { "id": "sec1", "topic": "Apartado1", "children": [...] } ] } }` }
        ];
        const text = await callOpenAI(messages);
        // Extraer JSON
        const jsonMatch = text.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error('No se pudo parsear el mapa conceptual');
        return JSON.parse(jsonMatch[0]);
      }

      // ------------------- Lógica principal -------------------
      async function generate() {
        state.apiKey = document.getElementById('apiKey').value.trim();
        if (!state.apiKey) return alert('Introduce tu API Key de OpenAI.');

        const numTopics = parseInt(document.getElementById('numTopics').value) || 2;
        const numSections = parseInt(document.getElementById('numSections').value) || 3;
        const numQuestions = parseInt(document.getElementById('numQuestions').value) || 2;

        const fileList = document.getElementById('localFiles').files;
        const localContext = fileList.length ? await readLocalFiles(fileList) : '';

        showProgress(true);
        updateProgress(0, 'Iniciando generación...');

        state.topics = [];

        for (let t = 0; t < numTopics; t++) {
          const topicTitle = await generateTopicTitle(t, localContext);
          const sectionTitles = await generateSections(topicTitle, numSections, localContext);

          const sections = [];
          for (let s = 0; s < sectionTitles.length; s++) {
            const content = await generateSectionContent(topicTitle, sectionTitles[s], localContext);
            const questions = numQuestions > 0 ? await generateQuestions(content, numQuestions) : [];
            sections.push({ title: sectionTitles[s], content, questions });

            const progress = Math.round(((t * sectionTitles.length + s + 1) / (numTopics * sectionTitles.length)) * 100);
            updateProgress(progress, `Tema ${t+1}/${numTopics} – Apartado ${s+1}/${sectionTitles.length}`);
          }

          const conceptMapData = await generateConceptMap(topicTitle, sectionTitles);
          state.topics.push({ title: topicTitle, sections, conceptMapData });
        }

        updateProgress(100, '¡Completado!');
        setTimeout(() => { showProgress(false); renderResults(); }, 1500);
      }

      // ------------------- Renderizado de resultados -------------------
      function renderResults() {
        const tabs = document.getElementById('topicTabs');
        const content = document.getElementById('topicContent');
        tabs.innerHTML = '';
        content.innerHTML = '';

        state.topics.forEach((topic, idx) => {
          // Tab
          const tabId = `topic-${idx}`;
          const li = document.createElement('li');
          li.className = 'nav-item';
          li.innerHTML = `<a class="nav-link ${idx===0?'active':''}" data-bs-toggle="tab" href="#${tabId}">${topic.title}</a>`;
          tabs.appendChild(li);

          // Panel
          const pane = document.createElement('div');
          pane.className = `tab-pane fade ${idx===0?'show active':''}`;
          pane.id = tabId;

          // Mapa conceptual
          const mapDiv = document.createElement('div');
          mapDiv.id = `concept-map-${idx}`;
          mapDiv.style.width = '100%';
          mapDiv.style.height = '400px';
          pane.appendChild(mapDiv);

          // Botón exportar notebook
          const exportBtn = document.createElement('button');
          exportBtn.className = 'btn btn-outline-secondary btn-sm my-2';
          exportBtn.textContent = '📥 Descargar cuaderno Jupyter (.ipynb)';
          exportBtn.onclick = () => downloadNotebook(idx);
          pane.appendChild(exportBtn);

          // Contenido notebook
          topic.sections.forEach(section => {
            // Celda markdown
            const mdCell = createNotebookCell('markdown', section.content);
            pane.appendChild(mdCell);

            // Preguntas
            if (section.questions.length) {
              const qCell = document.createElement('div');
              qCell.className = 'notebook-cell';
              qCell.innerHTML = `<div class="cell-header">📝 Preguntas tipo test</div><div class="cell-body">`;
              const qList = document.createElement('ol');
              section.questions.forEach(q => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>${q.question}</strong><br>${q.options.map((o,i) => `${String.fromCharCode(65+i)}) ${o}`).join('<br>')}<br><span class="text-success">✅ Correcta: ${q.correct}</span>`;
                qList.appendChild(li);
              });
              qCell.querySelector('.cell-body').appendChild(qList);
              pane.appendChild(qCell);
            }
          });

          content.appendChild(pane);

          // Inicializar jsMind después de que el panel sea visible
          setTimeout(() => {
            const jm = new jsMind({
              container: mapDiv.id,
              editable: false,
              theme: 'primary'
            });
            jm.show(topic.conceptMapData);
          }, 200);
        });

        // Refrescar MathJax
        if (window.MathJax) {
          MathJax.typesetPromise();
        }

        document.getElementById('resultsCard').classList.remove('d-none');
      }

      function createNotebookCell(type, source) {
        const cell = document.createElement('div');
        cell.className = 'notebook-cell';
        const header = document.createElement('div');
        header.className = 'cell-header';
        header.innerHTML = `<span>${type === 'markdown' ? '📖 Markdown' : '💻 Código'}</span><span>🔽</span>`;
        const body = document.createElement('div');
        body.className = `cell-body ${type === 'markdown' ? 'markdown-body' : 'code-body'}`;
        body.innerHTML = type === 'markdown' ? marked.parse(source) : source;
        cell.appendChild(header);
        cell.appendChild(body);
        return cell;
      }

      // Descargar .ipynb
      function downloadNotebook(topicIndex) {
        const topic = state.topics[topicIndex];
        const cells = [];

        topic.sections.forEach(section => {
          cells.push({
            cell_type: 'markdown',
            metadata: {},
            source: section.content
          });
          if (section.questions.length) {
            const qSource = section.questions.map((q,i) =>
              `**${i+1}. ${q.question}**\n\n${q.options.map((o,j)=>`${String.fromCharCode(65+j)}. ${o}`).join('\n')}\n\n*Respuesta correcta: ${q.correct}*`
            ).join('\n\n');
            cells.push({
              cell_type: 'markdown',
              metadata: {},
              source: qSource
            });
          }
        });

        const notebook = {
          metadata: {
            kernelspec: { display_name: "Python 3", language: "python", name: "python3" },
            language_info: { name: "python", version: "3.8.0" }
          },
          nbformat: 4,
          nbformat_minor: 5,
          cells
        };

        const blob = new Blob([JSON.stringify(notebook, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${topic.title.replace(/\s+/g, '_')}.ipynb`;
        a.click();
        URL.revokeObjectURL(url);
      }

      // Evento generar
      document.getElementById('generateBtn').addEventListener('click', generate);
    })();
  </script>
  <!-- Marked para renderizar Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>
</html>
